# English queries for embedding benchmark
test_data_dir: "test_data/en"
queries:
  - query: "TechCorp mission vision core values developer experience"
    lang: "en"
    expected_file: "docs/company-overview.md"
    expected_answer: "TechCorp mission is building scalable AI infrastructure. Vision is democratizing enterprise ML tooling. Core values: Developer Experience First, Open by Default, Reliability Over Features, Customer Obsession."
    category: "company_info"

  - query: "TechCorp company structure headcount department engineering product sales"
    lang: "en"
    expected_file: "docs/company-overview.md"
    expected_answer: "Engineering: 120 people, $18.5M budget. Product: 25 people, $3.2M. Sales & Marketing: 40 people, $8.1M. Operations: 15 people, $2.4M. Finance & Legal: 10 people, $1.8M. People & Culture: 8 people, $1.2M."
    category: "company_info"

  - query: "TechCorp ARR revenue growth metrics 2024 NPS gross margin"
    lang: "en"
    expected_file: "docs/company-overview.md"
    expected_answer: "ARR: $42.3M (+67% YoY). Customers: 2,847 (+89% YoY). NPS: 67. Gross Margin: 78%. Employee Count: 218."
    category: "company_info"

  - query: "OpenAPI 3.1.0 TechCorp AI Platform API version 2.4.0"
    lang: "en"
    expected_file: "api/openapi.json"
    expected_answer: "OpenAPI 3.1.0, version 2.4.0. REST API for model inference, fine-tuning, and deployment management."
    category: "api_spec"

  - query: "GET models endpoint parameters task limit offset pagination"
    lang: "en"
    expected_file: "api/openapi.json"
    expected_answer: "GET /models with query parameters: task (enum: text-generation, embedding, classification, summarization), limit (1-100, default 20), offset (>=0, default 0). Returns paginated model list."
    category: "api_spec"

  - query: "POST models model_id inference request body input parameters temperature top_p"
    lang: "en"
    expected_file: "api/openapi.json"
    expected_answer: "POST /models/{model_id}/inference with required input string (max 128000 chars), optional parameters (temperature 0-2 default 0.7, top_p 0-1 default 0.9, top_k 1-100 default 50, max_tokens 1-4096, stop_sequences array max 5, presence_penalty -2 to 2 default 0, frequency_penalty -2 to 2 default 0), stream boolean default false."
    category: "api_spec"

  - query: "fine-tuning job creation base_model training_data hyperparameters lora_rank"
    lang: "en"
    expected_file: "api/openapi.json"
    expected_answer: "POST /fine-tunes with required base_model (enum: llama-3.1-8b, llama-3.1-70b, mistral-7b, qwen2.5-7b) and training_data (dataset_id, format enum: alpaca/sharegpt/openai/jsonl, hyperparameters: learning_rate 1e-6 to 1e-3 default 2e-5, batch_size 1-32 default 4, epochs 1-10 default 3, lora_rank 8-128 default 32, lora_alpha 16-128 default 64, warmup_steps 0-1000 default 100)."
    category: "api_spec"

  - query: "deployment creation model_id replicas instance_type autoscaling gpu-a10g h100"
    lang: "en"
    expected_file: "api/openapi.json"
    expected_answer: "POST /deployments with required model_id, replicas (1-100), instance_type (enum: gpu-a10g-1x, gpu-a10g-4x, gpu-h100-1x, gpu-h100-8x, cpu-standard-8xlarge), optional autoscaling (min_replicas, max_replicas, target_utilization 0.1-0.9)."
    category: "api_spec"

  - query: "remote work allowance monthly stipend 150 USD internet electricity ergonomic"
    lang: "en"
    expected_file: "hr/policies.json"
    expected_answer: "Monthly stipend of 150 USD for internet, electricity, ergonomic equipment. Reimbursement via Expensify with receipts by 5th of following month. Equipment provided: laptop, monitor, keyboard, mouse, headset. Refresh cycle 3 years."
    category: "hr_policy"

  - query: "learning development annual budget 3000 USD Coursera edX Udemy O'Reilly"
    lang: "en"
    expected_file: "hr/policies.json"
    expected_answer: "Annual budget: $3000 USD, no rollover, resets Jan 1. Eligible: conferences, online courses, technical books, language learning, coaching. Approval: under $500 auto, $500-2000 manager+People Partner, over $2000 manager+People Partner+VP."
    category: "hr_policy"

  - query: "performance review cycle semi-annual OKR competencies calibration"
    lang: "en"
    expected_file: "hr/policies.json"
    expected_answer: "Semi-annual cycle (H1 Jan-Jun, H2 Jul-Dec). Timeline: self-review week 1-2, manager review week 3, calibration week 4, delivery week 5-6. Components: Goals & Outcomes 60% (Exceeds/Meets/Partially Meets/Does Not Meet), Competencies 25% (Role Model/Consistent/Developing/Needs Improvement), Values Alignment 15% (Exemplary/Aligned/Inconsistent/Misaligned)."
    category: "hr_policy"

  - query: "parental leave primary caregiver 20 weeks 100% salary secondary 8 weeks"
    lang: "en"
    expected_file: "hr/policies.json"
    expected_answer: "Primary caregiver: 20 weeks at 100% salary. Secondary caregiver: 8 weeks at 100% salary. Adoption/surrogacy same as primary. Pregnancy complications: additional 4 weeks at 100%. Flexible return: up to 12 weeks part-time at 60% hours with 100% pay, full remote first 8 weeks post-return."
    category: "hr_policy"

  - query: "liability cap 12 months fees MSA Acme Corporation indemnification mutual"
    lang: "en"
    expected_file: "legal/contracts.json"
    expected_answer: "MSA with Acme Corporation: liability cap 12 months fees, mutual indemnification, customer owns data/TechCorp owns platform, perpetual confidentiality, DPA Exhibit A, SLA 99.9% uptime with credits Exhibit B, termination for convenience 90 days notice. Annual value $480k USD, quarterly billing Net 30."
    category: "legal"

  - query: "GDPR DPA governing law German BDSG GlobalData GmbH subprocessors AWS Snowflake"
    lang: "en"
    expected_file: "legal/contracts.json"
    expected_answer: "DPA with GlobalData GmbH: GDPR + German BDSG governing law, Frankfurt jurisdiction. Data categories: personal_data, usage_analytics, support_tickets. Purposes: service_delivery, support, analytics. Subprocessors: AWS EU-West-1, Snowflake EU, PagerDuty US-EU SCC. Data subject rights 30-day SLA, breach notification 72 hours. DPO: dpo@techcorp.io. International transfers: SCC + UK Addendum."
    category: "legal"

  - query: "SOW deliverables HealthTech Solutions fine-tuning Llama-3.1-70B medical coding F1 0.92"
    lang: "en"
    expected_file: "legal/contracts.json"
    expected_answer: "SOW with HealthTech Solutions: custom fine-tuning Llama-3.1-70B for medical coding. Deliverables: fine-tuned model artifact, evaluation report (accuracy, latency, safety), deployment package (Docker+Helm), knowledge transfer session (4 hours). Acceptance: F1 > 0.92 on held-out test set, P99 latency < 500ms. Total value $185k USD, 4 milestones."
    category: "legal"

  - query: "PostgreSQL connection pool exhaustion pgbouncer SHOW POOLS wait_count"
    lang: "en"
    expected_file: "engineering/runbooks.jsonl"
    expected_answer: "Runbook rb-001: Check pgbouncer stats SHOW POOLS for high wait_count. Verify application connection lifecycle. Check for connection leaks in long-running transactions. Resolution: restart pgbouncer, increase pool_size, fix connection leaks, set statement_timeout=30s and idle_in_transaction_session_timeout=60s."
    category: "runbook"

  - query: "Kubernetes pod OOMKilled exit code 137 memory limit GOMEMLIMIT"
    lang: "en"
    expected_file: "engineering/runbooks.jsonl"
    expected_answer: "Runbook rb-002: kubectl describe pod to check Last State. Check memory limits vs requests. Profile application memory usage. Look for memory leaks. Resolution: increase memory limit, set GOMEMLIMIT or -Xmx, enable memory profiling, add memory request for Guaranteed QoS."
    category: "runbook"

  - query: "Redis cache stampede thundering herd distributed lock SETNX jitter TTL"
    lang: "en"
    expected_file: "engineering/runbooks.jsonl"
    expected_answer: "Runbook rb-003: Check Redis INFO for keyspace misses. Look for hot keys expiring simultaneously. Monitor DB connection count. Resolution: implement distributed lock (Redis SETNX) for cache rebuild, use probabilistic early expiration (jitter TTL), add request coalescing, pre-warm cache on deployment."
    category: "runbook"

  - query: "database migration lock timeout ALTER TABLE advisory lock pg_lock_timeout"
    lang: "en"
    expected_file: "engineering/runbooks.jsonl"
    expected_answer: "Runbook rb-008: Check pg_stat_activity for blocking queries. Long-running transactions holding locks. Missing CONCURRENTLY on index creation. Heavy read/write during migration. Resolution: kill blocking queries with pg_terminate_backend, use CREATE INDEX CONCURRENTLY, split large ALTER TABLE into steps, run migrations during low traffic."
    category: "runbook"

  - query: "PostgreSQL migration lock timeout incident INC-2024-0221 pg_terminate_backend"
    lang: "en"
    expected_file: "ops/incidents.jsonl"
    expected_answer: "INC-2024-0221: ALTER TABLE users ADD COLUMN preferences JSONB acquired AccessExclusiveLock. Long-running analytics query (pid 2847) held AccessShareLock for 45 min. Migration timeout 30s. Lock queue blocked all writes. Resolution: terminated blocking query, migration completed in 2.3s. Action items: add pg_lock_timeout, implement advisory lock pattern, add long-query detection alert, document zero-downtime migration checklist."
    category: "incident"

  - query: "Let's Encrypt certificate renewal failure Cloudflare WAF ACME HTTP-01 challenge"
    lang: "en"
    expected_file: "ops/incidents.jsonl"
    expected_answer: "INC-2024-0210: cert-manager ACME HTTP-01 challenge failed due to Cloudflare WAF blocking /.well-known/acme-challenge/ path. Rate limit hit after 5 retries. Resolution: created Cloudflare WAF bypass rule for challenge path, forced cert-manager renewal, certificate issued. Action items: switch to DNS-01 challenge, add cert-manager readiness probe, document Cloudflare integration."
    category: "incident"

  - query: "GitHub Actions runner pool exhaustion autoscaling actions-runner-controller"
    lang: "en"
    expected_file: "ops/incidents.jsonl"
    expected_answer: "INC-2024-0195: Self-hosted runner scale-set maxed at 20 runners. Monorepo PR validation uses 15 concurrent. 3 runners unhealthy (disk full). No auto-scale trigger. Resolution: manually terminated stuck jobs, cleared disk on unhealthy runners, queue drained. Action items: configure GitHub Actions autoscaling, add disk space monitoring + auto-cleanup, set workflow concurrency limits."
    category: "incident"

  - query: "Redis cache stampede feature flag service INC-2024-0189 distributed lock SETNX"
    lang: "en"
    expected_file: "ops/incidents.jsonl"
    expected_answer: "INC-2024-0189: Feature flag 'new-checkout-flow' expired at 12:30 UTC. 5000 concurrent requests hit cache miss simultaneously. All went to PostgreSQL for flag evaluation. DB CPU hit 100%. Resolution: manually set flag value in Redis, latency returned to normal. Action items: implement cache-aside with distributed lock (Redis SETNX), add jitter to TTL, add request coalescing, pre-warm cache on deployment."
    category: "incident"

  - query: "TechCorp Q4 2024 ARR 42300000 revenue growth 67% net revenue retention 123%"
    lang: "en"
    expected_file: "finance/quarterly-revenue.csv"
    expected_answer: "Q4 2024: ARR $42.3M, MRR $3.525M, New ARR $1.95M, Expansion ARR $820k, Churn ARR -$310k, Net New ARR $2.46M, Gross Margin 78%, CAC $10.8k, LTV $56k, Customers 2,847, Net Revenue Retention 123%."
    category: "finance"

  - query: "quarterly revenue trends 2023 2024 ARR MRR new ARR expansion churn"
    lang: "en"
    expected_file: "finance/quarterly-revenue.csv"
    expected_answer: "2024 quarters show sustained growth: Q1 ARR $38.2M, Q2 $40.1M, Q3 $41.5M, Q4 $42.3M. Net new ARR: Q1 $2.53M, Q2 $2.89M, Q3 $2.72M, Q4 $2.46M. Gross margin stable 77-78%. Net revenue retention improved from 112% to 123%."
    category: "finance"

  - query: "customer count net revenue retention CAC LTV by quarter 2024"
    lang: "en"
    expected_file: "finance/quarterly-revenue.csv"
    expected_answer: "2024 customer growth: Q1 2,150, Q2 2,420, Q3 2,680, Q4 2,847. Net revenue retention: Q1 118%, Q2 121%, Q3 122%, Q4 123%. CAC payback improved from 14.2 to 10.8 months. LTV/CAC ratio improved from 4.2 to 5.2."
    category: "finance"

  - query: "Engineering department budget 19.5M personnel infrastructure tools training contractors"
    lang: "en"
    expected_file: "finance/budget-2024.json"
    expected_answer: "Engineering Budget: $19.51M total (Personnel $14.2M, Infrastructure $2.8M, Tools/Licenses $950k, Training $360k, Contractors $1.2M). YTD actuals: $14.63M (25% variance). Forecast EOY: $18.8M. Headcount: 120."
    category: "finance"

  - query: "company total ARR 42.3M gross margin 78% cash position 28.5M runway 34 months"
    lang: "en"
    expected_file: "finance/budget-2024.json"
    expected_answer: "Total Budget: $40.56M, YTD actuals: $30.42M (25% variance), Forecast EOY: $39.12M. Revenue: ARR $42.3M (+67% YoY), Gross Margin 78%, Net Revenue Retention 123%, CAC Payback 14 months, LTV/CAC 4.2. Cash: $28.5M available, 34 months runway, $3.2M monthly burn."
    category: "finance"

