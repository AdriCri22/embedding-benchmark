# Catalan queries for embedding benchmark
test_data_dir: "test_data/ca"
queries:
  - query: "TechCorp missió visió valors fonamentals desenvolupador"
    lang: "ca"
    expected_file: "docs/resum-empresa.md"
    expected_answer: "Missió: construir infraestructura IA escalable. Visió: democratitzar eines ML empresarials. Valors: Experiència Desenvolupador Primer, Obert per Defecte, Fiabilitat sobre Funcionalitats, Obsessió pel Client."
    category: "company_info"

  - query: "TechCorp estructura empresa plantilla departament enginyeria producte vendes"
    lang: "ca"
    expected_file: "docs/resum-empresa.md"
    expected_answer: "Enginyeria: 120 persones, $18.5M pressupost. Producte: 25 persones, $3.2M. Vendes i Màrqueting: 40 persones, $8.1M. Operacions: 15 persones, $2.4M. Finances i Legal: 10 persones, $1.8M. Persones i Cultura: 8 persones, $1.2M."
    category: "company_info"

  - query: "TechCorp ARR creixement ingressos mètriques 2024 NPS marge brut"
    lang: "ca"
    expected_file: "docs/resum-empresa.md"
    expected_answer: "ARR: $42.3M (+67% interanual). Clients: 2,847 (+89% interanual). NPS: 67. Marge Brut: 78%. Empleats: 218."
    category: "company_info"

  - query: "OpenAPI versió TechCorp API Plataforma IA"
    lang: "ca"
    expected_file: "api/openapi.json"
    expected_answer: "OpenAPI 3.1.0, versió 2.4.0. API REST per a inferència de models, fine-tuning i gestió de desplegaments."
    category: "api_spec"

  - query: "GET models endpoint paràmetres task limit offset paginació"
    lang: "ca"
    expected_file: "api/openapi.json"
    expected_answer: "GET /models amb paràmetres: task (enum: text-generation, embedding, classification, summarization), limit (1-100, default 20), offset (>=0, default 0). Retorna llista paginada de models."
    category: "api_spec"

  - query: "POST models model_id inference request body input parameters temperature top_p"
    lang: "ca"
    expected_file: "api/openapi.json"
    expected_answer: "POST /models/{model_id}/inference amb input string requerit (max 128000 chars), paràmetres opcionals (temperature 0-2 default 0.7, top_p 0-1 default 0.9, top_k 1-100 default 50, max_tokens 1-4096, stop_sequences array max 5, presence_penalty -2 a 2 default 0, frequency_penalty -2 a 2 default 0), stream boolean default false."
    category: "api_spec"

  - query: "fine-tuning job creation base_model training_data hyperparameters lora_rank"
    lang: "ca"
    expected_file: "api/openapi.json"
    expected_answer: "POST /fine-tunes amb base_model requerit (enum: llama-3.1-8b, llama-3.1-70b, mistral-7b, qwen2.5-7b) i training_data (dataset_id, format enum: alpaca/sharegpt/openai/jsonl, hyperparameters: learning_rate 1e-6 a 1e-3 default 2e-5, batch_size 1-32 default 4, epochs 1-10 default 3, lora_rank 8-128 default 32, lora_alpha 16-128 default 64, warmup_steps 0-1000 default 100)."
    category: "api_spec"

  - query: "deployment creation model_id replicas instance_type autoscaling gpu-a10g h100"
    lang: "ca"
    expected_file: "api/openapi.json"
    expected_answer: "POST /deployments amb model_id, replicas (1-100), instance_type (enum: gpu-a10g-1x, gpu-a10g-4x, gpu-h100-1x, gpu-h100-8x, cpu-standard-8xlarge), autoscaling opcional (min_replicas, max_replicas, target_utilization 0.1-0.9)."
    category: "api_spec"

  - query: "subsidi mensual treball remot teletreball 150 USD internet electricitat"
    lang: "ca"
    expected_file: "hr/politiques.json"
    expected_answer: "Subsidi mensual de 150 USD per internet, electricitat, equipament ergonomic. Reemborsament via Expensify abans del dia 5 del mes següent."
    category: "hr_policy"

  - query: "pressupost formació desenvolupament anual 3000 USD Coursera edX Udemy O'Reilly"
    lang: "ca"
    expected_file: "hr/politiques.json"
    expected_answer: "Pressupost anual: $3000 USD, no acumulable, reset 1 gen 2025. Elegibles: conferències, cursos online, llibres tècnics, idiomes, coaching. Aprovació: <$500 auto, $500-2000 gerent+People Partner, >$2000 gerent+People Partner+VP."
    category: "hr_policy"

  - query: "cicle avaluació desenpeny semestral OKR competències calibratge"
    lang: "ca"
    expected_file: "hr/politiques.json"
    expected_answer: "Cicle semestral (S1 Gen-Jun, S2 Jul-Des). Cronograma: autoavaluació set 1-2, avaluació gerent set 3, calibratge set 4, lliurament set 5-6. Components: Objectius 60% (Supera/Completa/Parcial/No), Competències 25% (Model/Consistent/Desenvolupament/Millora), Valors 15% (Exemplar/Alineat/Inconsistent/Desalineat)."
    category: "hr_policy"

  - query: "permís parental cuidador principal 20 setmanes 100% salari secundari 8 setmanes"
    lang: "ca"
    expected_file: "hr/politiques.json"
    expected_answer: "Cuidador principal: 20 setmanes al 100% salari. Cuidador secundari: 8 setmanes al 100%. Adopció/subrogació igual que principal. Complicacions embaràs: 4 setmanes extra al 100%. Tornada flexible: fins a 12 setmanes meitat jornada 60% hores 100% salari, remot total primeres 8 setmanes."
    category: "hr_policy"

  - query: "límite responsabilitat MSA Acme Corporation indemnització mutua"
    lang: "ca"
    expected_file: "legal/contractes.json"
    expected_answer: "MSA amb Acme Corporation: límit responsabilitat 12 mesos honoraris, indemnització mutua, client posseix dades/TechCorp posseix plataforma, confidencialitat perpetua, DPA Annex A, SLA 99.9% uptime crèdits Annex B, terminació conveniència 90 dies avís. Valor anual $480k USD, facturació trimestral Net 30."
    category: "legal"

  - query: "GDPR DPA lei aplicable German BDSG GlobalData GmbH subprocessors AWS Snowflake"
    lang: "ca"
    expected_file: "legal/contractes.json"
    expected_answer: "DPA amb GlobalData GmbH: GDPR + BDSG alemany lei aplicable, jurisdicció Frankfurt. Categories dades: personal_data, usage_analytics, support_tickets. Propòsits: service_delivery, support, analytics. Subprocessadors: AWS EU-West-1, Snowflake EU, PagerDuty US-EU SCC. Drets interessat SLA 30 dies, notificació incidència 72 hores. DPO: dpo@techcorp.io. Transferències internacionals: SCC + UK Addendum."
    category: "legal"

  - query: "SOW entregables HealthTech Solutions fine-tuning Llama-3.1-70B codificació mèdica F1 0.92"
    lang: "ca"
    expected_file: "legal/contractes.json"
    expected_answer: "SOW amb HealthTech Solutions: fine-tuning personalitzat Llama-3.1-70B per a codificació mèdica. Entregables: artefacte model fine-tuned, informe avaluació (precisió, latència, seguretat), paquet desplegament (Docker+Helm), sessió transferència coneixement (4 hores). Criteris acceptació: F1 > 0.92 en test set held-out, P99 latència < 500ms. Valor total $185k USD, 4 hitos."
    category: "legal"

  - query: "PostgreSQL connection pool exhaustion pgbouncer SHOW POOLS wait_count"
    lang: "ca"
    expected_file: "engineering/runbooks.jsonl"
    expected_answer: "Runbook rb-001: Revisar stats pgbouncer SHOW POOLS per wait_count alt. Verificar cicle de vida connexions aplicació. Buscar fugues de connexió en transaccions llargues. Resolució: reiniciar pgbouncer, augmentar pool_size, corregir fugues, configurar statement_timeout=30s i idle_in_transaction_session_timeout=60s."
    category: "runbook"

  - query: "Kubernetes pod OOMKilled exit code 137 memory limit GOMEMLIMIT"
    lang: "ca"
    expected_file: "engineering/runbooks.jsonl"
    expected_answer: "Runbook rb-002: kubectl describe pod revisar Last State. Verificar límits vs requests memòria. Perfilar ús memòria aplicació. Buscar memory leaks. Resolució: augmentar límit memòria, configurar GOMEMLIMIT o -Xmx, habilitar profiling memòria, afegir memory request per QoS Garantit."
    category: "runbook"

  - query: "Redis cache stampede thundering herd distributed lock SETNX jitter TTL"
    lang: "ca"
    expected_file: "engineering/runbooks.jsonl"
    expected_answer: "Runbook rb-003: Revisar Redis INFO stats per keyspace misses. Buscar claus calentes expirant simultàniament. Monitoritzar comptador connexions DB. Resolució: implementar lock distribuït (Redis SETNX) per reconstrucció càcheu, usar expiració probabilística primerenca (jitter TTL), afegir coalescing peticions, pre-escalfar càcheu en desplegament."
    category: "runbook"

  - query: "database migration lock timeout ALTER TABLE advisory lock pg_lock_timeout"
    lang: "ca"
    expected_file: "engineering/runbooks.jsonl"
    expected_answer: "Runbook rb-008: Revisar pg_stat_activity per queries bloquejants. Transaccions llargues mantenint locks. Falta CONCURRENTLY en creació índex. Lectura/escriptura intensa durant migració. Resolució: matar queries bloquejants amb pg_terminate_backend, usar CREATE INDEX CONCURRENTLY, dividir ALTER TABLE gran en passos, executar migracions en tràfic baix."
    category: "runbook"

  - query: "PostgreSQL migration lock timeout incidente"
    lang: "ca"
    expected_file: "ops/incidents.jsonl"
    expected_answer: "INC-2024-0221: ALTER TABLE users ADD COLUMN preferences JSONB va adquirir AccessExclusiveLock. Consulta analítica llarga (pid 2847) va mantenir AccessShareLock 45 min. Timeout migració 30s va bloquejar escriptures. Resolució: va finalitzar query bloquejant, migració va completar en 2.3s. Action items: pg_lock_timeout, advisory lock, alerta query llarga, checklist zero-downtime."
    category: "incident"

  - query: "Let's Encrypt certificate renewal failure Cloudflare WAF ACME HTTP-01 challenge"
    lang: "ca"
    expected_file: "ops/incidents.jsonl"
    expected_answer: "INC-2024-0210: Challenge ACME HTTP-01 cert-manager va fallar per Cloudflare WAF bloquejant /.well-known/acme-challenge/. Rate limit després de 5 reintents. Resolució: regla bypass Cloudflare WAF per path challenge, va forçar renovació cert-manager, certificat emès. Action items: DNS-01 challenge, readiness probe cert-manager, documentar integració Cloudflare."
    category: "incident"

  - query: "GitHub Actions runner pool exhaustion autoscaling actions-runner-controller"
    lang: "ca"
    expected_file: "ops/incidents.jsonl"
    expected_answer: "INC-2024-0195: Scale-set self-hosted runner màx 20 runners. Validació PR monorepo usa 15 concurrents. 3 runners unhealthy (disk full). No auto-scale trigger configurat. Resolució: va finalitzar jobs atascats manualment, va netejar disc runners unhealthy, cua va drenar. Action items: autoscaling GitHub Actions, monitorització disc + auto-netejada, límits concorrència workflow."
    category: "incident"

  - query: "Redis cache stampede feature flag service INC-2024-0189 distributed lock SETNX"
    lang: "ca"
    expected_file: "ops/incidents.jsonl"
    expected_answer: "INC-2024-0189: Feature flag 'new-checkout-flow' va expirar a les 12:30 UTC. 5000 peticions concurrents cache miss simultani. Totes van anar a PostgreSQL per avaluar flag. CPU DB al 100%. Resolució: va establir manualment valor flag a Redis, latència va normalitzar. Action items: cache-aside amb lock distribuït (Redis SETNX), jitter TTL, coalescing peticions, pre-escalfar càcheu en desplegament."
    category: "incident"

  - query: "TechCorp Q4 2024 ARR 42300000 revenue growth 67% net revenue retention 123%"
    lang: "ca"
    expected_file: "finance/ingressos-trimestrals.csv"
    expected_answer: "T4 2024: ARR $42.3M, MRR $3.525M, Nou ARR $1.95M, Expansió ARR $820k, Churn ARR -$310k, Net Nou ARR $2.46M, Marge Brut 78%, CAC $10.8k, LTV $56k, Clients 2,847, Retenció Ingressos Neta 123%."
    category: "finance"

  - query: "quarterly revenue trends 2023 2024 ARR MRR new ARR expansion churn"
    lang: "ca"
    expected_file: "finance/ingressos-trimestrals.csv"
    expected_answer: "2024 trimestres mostren creixement sostingut: T1 ARR $38.2M, T2 $40.1M, T3 $41.5M, T4 $42.3M. Net nou ARR: T1 $2.53M, T2 $2.89M, T3 $2.72M, T4 $2.46M. Marge brut estable 77-78%. Retenció neta ingressos va millorar de 112% a 123%."
    category: "finance"

  - query: "customer count net revenue retention CAC LTV by quarter 2024"
    lang: "ca"
    expected_file: "finance/ingressos-trimestrals.csv"
    expected_answer: "2024 creixement clients: T1 2,150, T2 2,420, T3 2,680, T4 2,847. Retenció neta ingressos: T1 118%, T2 121%, T3 122%, T4 123%. CAC payback va millorar de 14.2 a 10.8 mesos. LTV/CAC ratio va millorar de 4.2 a 5.2."
    category: "finance"

  - query: "Engineering department budget 19.5M personnel infrastructure tools training contractors"
    lang: "ca"
    expected_file: "finance/pressupost-2024.json"
    expected_answer: "Pressupost Enginyeria: $19.51M total (Personal $14.2M, Infraestructura $2.8M, Eines/Llicències $950k, Formació $360k, Contractistes $1.2M). YTD actuals: $14.63M (25% variació). Previsió EOY: $18.8M. Plantilla: 120."
    category: "finance"

  - query: "company total ARR 42.3M gross margin 78% cash position 28.5M runway 34 months"
    lang: "ca"
    expected_file: "finance/pressupost-2024.json"
    expected_answer: "Pressupost total: $40.56M, YTD actuals: $30.42M (25% variació), Previsió EOY: $39.12M. Ingressos: ARR $42.3M (+67% interanual), Marge Brut 78%, Retenció Neta Ingressos 123%, CAC Payback 14 mesos, LTV/CAC 4.2. Efectiu: $28.5M disponible, 34 mesos runway, $3.2M crema mensual."
    category: "finance"

