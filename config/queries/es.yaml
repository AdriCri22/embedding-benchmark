# Spanish queries for embedding benchmark
test_data_dir: "test_data/es"
queries:
  - query: "TechCorp misión visión valores fundamentales desarrollador"
    lang: "es"
    expected_file: "docs/resumen-empresa.md"
    expected_answer: "Misión: construir infraestructura IA escalable. Visión: democratizar herramientas ML empresariales. Valores: Experiencia Desarrollador Primero, Abierto por Defecto, Fiabilidad sobre Funcionalidades, Obsesión por el Cliente."
    category: "company_info"

  - query: "TechCorp estructura empresa plantilla departament enginyeria producte vendes"
    lang: "es"
    expected_file: "docs/resumen-empresa.md"
    expected_answer: "Ingeniería: 120 personas, $18.5M presupuesto. Producto: 25 personas, $3.2M. Ventas y Marketing: 40 personas, $8.1M. Operaciones: 15 personas, $2.4M. Finanzas y Legal: 10 personas, $1.8M. Personas y Cultura: 8 personas, $1.2M."
    category: "company_info"

  - query: "TechCorp ARR crecimiento ingresos métricas 2024 NPS margen bruto"
    lang: "es"
    expected_file: "docs/resumen-empresa.md"
    expected_answer: "ARR: $42.3M (+67% interanual). Clientes: 2,847 (+89% interanual). NPS: 67. Margen Bruto: 78%. Empleados: 218."
    category: "company_info"

  - query: "OpenAPI 3.1.0 TechCorp API Plataforma IA versión 2.4.0"
    lang: "es"
    expected_file: "api/openapi.json"
    expected_answer: "OpenAPI 3.1.0, versión 2.4.0. API REST para inferencia de modelos, fine-tuning y gestión de despliegues."
    category: "api_spec"

  - query: "GET models endpoint parámetros task limit offset paginación"
    lang: "es"
    expected_file: "api/openapi.json"
    expected_answer: "GET /models con parámetros: task (enum: text-generation, embedding, classification, summarization), limit (1-100, default 20), offset (>=0, default 0). Retorna lista paginada de modelos."
    category: "api_spec"

  - query: "POST models model_id inference request body input parameters temperature top_p"
    lang: "es"
    expected_file: "api/openapi.json"
    expected_answer: "POST /models/{model_id}/inference con input string requerido (max 128000 chars), parámetros opcionales (temperature 0-2 default 0.7, top_p 0-1 default 0.9, top_k 1-100 default 50, max_tokens 1-4096, stop_sequences array max 5, presence_penalty -2 a 2 default 0, frequency_penalty -2 a 2 default 0), stream boolean default false."
    category: "api_spec"

  - query: "fine-tuning job creation base_model training_data hyperparameters lora_rank"
    lang: "es"
    expected_file: "api/openapi.json"
    expected_answer: "POST /fine-tunes con base_model requerido (enum: llama-3.1-8b, llama-3.1-70b, mistral-7b, qwen2.5-7b) y training_data (dataset_id, format enum: alpaca/sharegpt/openai/jsonl, hyperparameters: learning_rate 1e-6 a 1e-3 default 2e-5, batch_size 1-32 default 4, epochs 1-10 default 3, lora_rank 8-128 default 32, lora_alpha 16-128 default 64, warmup_steps 0-1000 default 100)."
    category: "api_spec"

  - query: "deployment creation model_id replicas instance_type autoscaling gpu-a10g h100"
    lang: "es"
    expected_file: "api/openapi.json"
    expected_answer: "POST /deployments con model_id, replicas (1-100), instance_type (enum: gpu-a10g-1x, gpu-a10g-4x, gpu-h100-1x, gpu-h100-8x, cpu-standard-8xlarge), autoscaling opcional (min_replicas, max_replicas, target_utilization 0.1-0.9)."
    category: "api_spec"

  - query: "subsidio mensual trabajo remoto teletrabajo 150 USD internet electricidad"
    lang: "es"
    expected_file: "hr/politicas.json"
    expected_answer: "Subsidio mensual de 150 USD para internet, electricidad, equipamiento ergonómico. Reembolso via Expensify antes del día 5 del mes siguiente."
    category: "hr_policy"

  - query: "presupuesto formación desarrollo anual 3000 USD Coursera edX Udemy O'Reilly"
    lang: "es"
    expected_file: "hr/politicas.json"
    expected_answer: "Presupuesto anual: $3000 USD, no acumulable, reset 1 ene 2025. Elegibles: conferencias, cursos online, libros técnicos, idiomas, coaching. Aprobación: <$500 auto, $500-2000 gerente+People Partner, >$2000 gerente+People Partner+VP."
    category: "hr_policy"

  - query: "ciclo evaluación desempeño semestral OKR competencias calibrado"
    lang: "es"
    expected_file: "hr/politicas.json"
    expected_answer: "Ciclo semestral (S1 Ene-Jun, S2 Jul-Dic). Cronograma: autoevaluación sem 1-2, evaluación gerente sem 3, calibrado sem 4, entrega sem 5-6. Componentes: Objetivos 60% (Supera/Completa/Parcial/No), Competencias 25% (Modelo/Consistente/Desarrollo/Mejora), Valores 15% (Ejemplar/Alineado/Inconsistente/Desalineado)."
    category: "hr_policy"

  - query: "permiso parental cuidador principal 20 semanas 100% salario secundario 8 semanas"
    lang: "es"
    expected_file: "hr/politicas.json"
    expected_answer: "Cuidador principal: 20 semanas al 100% salario. Cuidador secundario: 8 semanas al 100%. Adopción/subrogación igual que principal. Complicaciones embarazo: 4 semanas extra al 100%. Vuelta flexible: hasta 12 semanas media jornada 60% horas 100% salario, remoto total primeras 8 semanas."
    category: "hr_policy"

  - query: "límite responsabilidad MSA Acme Corporation indemnización mutua"
    lang: "es"
    expected_file: "legal/contratos.json"
    expected_answer: "MSA con Acme Corporation: límite responsabilidad 12 meses honorarios, indemnización mutua, cliente posee datos/TechCorp posee plataforma, confidencialidad perpetua, DPA Anexo A, SLA 99.9% uptime créditos Anexo B, terminación conveniencia 90 días aviso. Valor anual $480k USD, facturación trimestral Net 30."
    category: "legal"

  - query: "GDPR DPA ley aplicable German BDSG GlobalData GmbH subprocessors AWS Snowflake"
    lang: "es"
    expected_file: "legal/contratos.json"
    expected_answer: "DPA con GlobalData GmbH: GDPR + BDSG alemán ley aplicable, jurisdicción Frankfurt. Categorías datos: personal_data, usage_analytics, support_tickets. Propósitos: service_delivery, support, analytics. Subprocesadores: AWS EU-West-1, Snowflake EU, PagerDuty US-EU SCC. Derechos interesado SLA 30 días, notificación incidencia 72 horas. DPO: dpo@techcorp.io. Transferencias internacionales: SCC + UK Addendum."
    category: "legal"

  - query: "SOW entregables HealthTech Solutions fine-tuning Llama-3.1-70B codificación médica F1 0.92"
    lang: "es"
    expected_file: "legal/contratos.json"
    expected_answer: "SOW con HealthTech Solutions: fine-tuning personalizado Llama-3.1-70B para codificación médica. Entregables: artefacto modelo fine-tuned, informe evaluación (precisión, latencia, seguridad), paquete despliegue (Docker+Helm), sesión transferencia conocimiento (4 horas). Criterios aceptación: F1 > 0.92 en test set held-out, P99 latencia < 500ms. Valor total $185k USD, 4 hitos."
    category: "legal"

  - query: "PostgreSQL connection pool exhaustion pgbouncer SHOW POOLS wait_count"
    lang: "es"
    expected_file: "engineering/runbooks.jsonl"
    expected_answer: "Runbook rb-001: Revisar stats pgbouncer SHOW POOLS para wait_count alto. Verificar ciclo de vida conexiones aplicación. Buscar fugas de conexión en transacciones largas. Resolución: reiniciar pgbouncer, aumentar pool_size, corregir fugas, configurar statement_timeout=30s e idle_in_transaction_session_timeout=60s."
    category: "runbook"

  - query: "Kubernetes pod OOMKilled exit code 137 memory limit GOMEMLIMIT"
    lang: "es"
    expected_file: "engineering/runbooks.jsonl"
    expected_answer: "Runbook rb-002: kubectl describe pod revisar Last State. Verificar límites vs requests memoria. Perfilar uso memoria aplicación. Buscar memory leaks. Resolución: aumentar límite memoria, configurar GOMEMLIMIT o -Xmx, habilitar profiling memoria, añadir memory request para QoS Garantizado."
    category: "runbook"

  - query: "Redis cache stampede thundering herd distributed lock SETNX jitter TTL"
    lang: "es"
    expected_file: "engineering/runbooks.jsonl"
    expected_answer: "Runbook rb-003: Revisar Redis INFO stats para keyspace misses. Buscar claves calientes expirando simultáneamente. Monitorizar contador conexiones DB. Resolución: implementar lock distribuido (Redis SETNX) para reconstrucción caché, usar expiración probabilística temprana (jitter TTL), añadir coalescing peticiones, pre-calentar caché en despliegue."
    category: "runbook"

  - query: "database migration lock timeout ALTER TABLE advisory lock pg_lock_timeout"
    lang: "es"
    expected_file: "engineering/runbooks.jsonl"
    expected_answer: "Runbook rb-008: Revisar pg_stat_activity para queries bloqueantes. Transacciones largas manteniendo locks. Falta CONCURRENTLY en creación índice. Lectura/escritura intensa durante migración. Resolución: matar queries bloqueantes con pg_terminate_backend, usar CREATE INDEX CONCURRENTLY, dividir ALTER TABLE grande en pasos, ejecutar migraciones en tráfico bajo."
    category: "runbook"

  - query: "PostgreSQL migration lock timeout incidente INC-2024-0221 pg_terminate_backend"
    lang: "es"
    expected_file: "ops/incidentes.jsonl"
    expected_answer: "INC-2024-0221: ALTER TABLE users ADD COLUMN preferences JSONB adquirió AccessExclusiveLock. Consulta analítica larga (pid 2847) mantuvo AccessShareLock 45 min. Timeout migración 30s bloqueó escrituras. Resolución: terminó query bloqueante, migración completó en 2.3s. Action items: pg_lock_timeout, advisory lock, alerta query larga, checklist zero-downtime."
    category: "incident"

  - query: "Let's Encrypt certificate renewal failure Cloudflare WAF ACME HTTP-01 challenge"
    lang: "es"
    expected_file: "ops/incidentes.jsonl"
    expected_answer: "INC-2024-0210: Challenge ACME HTTP-01 cert-manager falló por Cloudflare WAF bloqueando /.well-known/acme-challenge/. Rate limit tras 5 reintentos. Resolución: regla bypass Cloudflare WAF para path challenge, forzó renovación cert-manager, certificado emitido. Action items: DNS-01 challenge, readiness probe cert-manager, documentar integración Cloudflare."
    category: "incident"

  - query: "GitHub Actions runner pool exhaustion autoscaling actions-runner-controller"
    lang: "es"
    expected_file: "ops/incidentes.jsonl"
    expected_answer: "INC-2024-0195: Scale-set self-hosted runner máx 20 runners. Validación PR monorepo usa 15 concurrentes. 3 runners unhealthy (disk full). No auto-scale trigger configurado. Resolución: finalizó jobs atascados manualmente, limpió disco runners unhealthy, cola drenó. Action items: autoscaling GitHub Actions, monitorización disco + auto-limpieza, límites concurrencia workflow."
    category: "incident"

  - query: "Redis cache stampede feature flag service INC-2024-0189 distributed lock SETNX"
    lang: "es"
    expected_file: "ops/incidentes.jsonl"
    expected_answer: "INC-2024-0189: Feature flag 'new-checkout-flow' expiró a las 12:30 UTC. 5000 peticiones concurrentes cache miss simultáneo. Todas fueron a PostgreSQL para evaluar flag. CPU DB al 100%. Resolución: estableció manualmente valor flag en Redis, latencia normalizó. Action items: cache-aside con lock distribuido (Redis SETNX), jitter TTL, coalescing peticiones, pre-calentar caché en despliegue."
    category: "incident"

  - query: "TechCorp Q4 2024 ARR 42300000 revenue growth 67% net revenue retention 123%"
    lang: "es"
    expected_file: "finance/ingresos-trimestrales.csv"
    expected_answer: "T4 2024: ARR $42.3M, MRR $3.525M, Nuevo ARR $1.95M, Expansión ARR $820k, Churn ARR -$310k, Neto Nuevo ARR $2.46M, Margen Bruto 78%, CAC $10.8k, LTV $56k, Clientes 2,847, Retención Ingresos Neta 123%."
    category: "finance"

  - query: "quarterly revenue trends 2023 2024 ARR MRR new ARR expansion churn"
    lang: "es"
    expected_file: "finance/ingresos-trimestrales.csv"
    expected_answer: "2024 trimestres muestran crecimiento sostenido: T1 ARR $38.2M, T2 $40.1M, T3 $41.5M, T4 $42.3M. Neto nuevo ARR: T1 $2.53M, T2 $2.89M, T3 $2.72M, T4 $2.46M. Margen bruto estable 77-78%. Retención neta ingresos mejoró de 112% a 123%."
    category: "finance"

  - query: "customer count net revenue retention CAC LTV by quarter 2024"
    lang: "es"
    expected_file: "finance/ingresos-trimestrales.csv"
    expected_answer: "2024 crecimiento clientes: T1 2,150, T2 2,420, T3 2,680, T4 2,847. Retención neta ingresos: T1 118%, T2 121%, T3 122%, T4 123%. CAC payback mejoró de 14.2 a 10.8 meses. LTV/CAC ratio mejoró de 4.2 a 5.2."
    category: "finance"

  - query: "Engineering department budget 19.5M personnel infrastructure tools training contractors"
    lang: "es"
    expected_file: "finance/presupuesto-2024.json"
    expected_answer: "Presupuesto Ingeniería: $19.51M total (Personal $14.2M, Infraestructura $2.8M, Herramientas/Licencias $950k, Formación $360k, Contratistas $1.2M). YTD actuales: $14.63M (25% variación). Previsión EOY: $18.8M. Plantilla: 120."
    category: "finance"

  - query: "company total ARR 42.3M gross margin 78% cash position 28.5M runway 34 months"
    lang: "es"
    expected_file: "finance/presupuesto-2024.json"
    expected_answer: "Presupuesto total: $40.56M, YTD actuales: $30.42M (25% variación), Previsión EOY: $39.12M. Ingresos: ARR $42.3M (+67% interanual), Margen Bruto 78%, Retención Neta Ingresos 123%, CAC Payback 14 meses, LTV/CAC 4.2. Efectivo: $28.5M disponible, 34 meses runway, $3.2M crema mensual."
    category: "finance"

