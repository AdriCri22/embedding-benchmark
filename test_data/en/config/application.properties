# TechCorp AI Platform - Application Properties
# Spring Boot style configuration for Java services

# Application
application.name=TechCorp AI Platform
application.version=2.4.0
application.environment=production

# Server
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/api/v2
server.tomcat.max-threads=200
server.tomcat.max-connections=10000
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Database
spring.datasource.url=jdbc:postgresql://postgres-primary.techcorp.io:5432/techcorp_prod
spring.datasource.username=app_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Redis
spring.redis.host=redis-cluster.techcorp.io
spring.redis.port=6379
spring.redis.password=${REDIS_PASSWORD}
spring.redis.database=0
spring.redis.lettuce.pool.max-active=50
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=5
spring.redis.timeout=5000ms

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.key-prefix=tc:
spring.cache.redis.use-key-prefix=true
spring.cache.redis.cache-null-values=false

# Security
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://auth.techcorp.io/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.techcorp.io

# Actuator/Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.techcorp=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/techcorp-ai-platform.log
logging.file.max-size=100MB
logging.file.max-history=30

# OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.techcorp.aiplatform

# AI Models
techcorp.ai.embedding.model=text-embedding-3-small
techcorp.ai.embedding.dimensions=1536
techcorp.ai.embedding.batch-size=100
techcorp.ai.inference.model=llama-3.2-3b-instruct
techcorp.ai.inference.max-tokens=4096
techcorp.ai.inference.temperature=0.7

# Feature Flags
techcorp.feature.new-checkout-flow=false
techcorp.feature.ai-recommendations=true
techcorp.feature.advanced-analytics=false
techcorp.feature.beta-features=false