# TechCorp AI Platform - INI Configuration File
# Simple INI format for legacy system compatibility

[application]
name = TechCorp AI Platform
version = 2.4.0
environment = production
debug = false

[server]
host = 0.0.0.0
port = 8080
workers = 4
timeout = 30
max_request_size = 10485760

[database]
primary_host = postgres-primary.techcorp.io
primary_port = 5432
primary_database = techcorp_prod
primary_username = app_user
primary_password = ${DB_PASSWORD}
primary_pool_size = 20
primary_max_overflow = 10
primary_ssl_mode = require

replica_host = postgres-replica.techcorp.io
replica_port = 5432
replica_database = techcorp_prod
replica_username = app_user
replica_password = ${DB_PASSWORD}
replica_pool_size = 10

[redis]
host = redis-cluster.techcorp.io
port = 6379
password = ${REDIS_PASSWORD}
db = 0
max_connections = 50
socket_timeout = 5
socket_connect_timeout = 5

[cache]
default_ttl = 3600
max_size = 1073741824
eviction_policy = allkeys-lru
key_prefix = tc:

[ai_models]
embedding_default = text-embedding-3-small
embedding_fallback = gte-base
embedding_batch_size = 100
embedding_max_tokens = 8191
inference_default = llama-3.2-3b-instruct
inference_max_tokens = 4096
inference_temperature = 0.7
inference_top_p = 0.9

[monitoring]
metrics_enabled = true
metrics_port = 9090
metrics_path = /metrics
logging_level = INFO
logging_format = json
logging_output = stdout
tracing_enabled = true
tracing_sample_rate = 0.1
tracing_endpoint = http://jaeger:14268/api/traces

[security]
jwt_secret = ${JWT_SECRET}
jwt_algorithm = RS256
jwt_expiration = 3600
cors_allowed_origins = https://app.techcorp.io,https://admin.techcorp.io
cors_allowed_methods = GET,POST,PUT,DELETE,OPTIONS
cors_allowed_headers = Authorization,Content-Type,X-Request-ID
rate_limiting_enabled = true
rate_limiting_requests_per_minute = 1000
rate_limiting_burst = 200

[feature_flags]
new_checkout_flow = false
ai_recommendations = true
advanced_analytics = false
beta_features = false